<!DOCTYPE html>
<html lang="en" data-city="nyc">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090f">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>DSN Places</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS
   ═══════════════════════════════════════════════════════════ */
:root {
  /* spacing — 8pt grid */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;
  --s12: 48px; --s16: 64px;

  /* type scale */
  --t-xs: 9px; --t-sm: 10.5px; --t-md: 13px;
  --t-lg: 15px; --t-xl: 20px; --t-2xl: 26px;

  /* radii */
  --r-sm: 4px; --r-md: 8px; --r-lg: 14px; --r-pill: 999px;

  /* rating ramp — shared across cities so tiers read the same everywhere */
  --rt-elite: #f2c94c;
  --rt-9:     #f28f5b;
  --rt-8:     #e0698b;
  --rt-7:     #8e9ec9;
  --rt-6:     #6d7c98;
  --rt-5:     #5b6474;
  --rt-low:   #7a3b46;
  --rt-none:  #4a4a58;

  --ease: cubic-bezier(.22,.61,.36,1);
}

/* ── NEW YORK: midnight + brass ── */
:root[data-city="nyc"] {
  --bg:        #07090f;
  --surface:   #10141f;
  --surface-2: #171d2b;
  --border:    rgba(224,178,60,.14);
  --border-2:  rgba(224,178,60,.30);
  --text:      #f4f1e8;
  --muted:     #9a9aab;
  --accent:    #e0b23c;
  --accent-lt: #f7dc95;
  --accent-dk: #7a5f1c;
  --accent-rgb: 224,178,60;
  --second:    #5b8fd6;
  --second-rgb: 91,143,214;
  --glow-1:    rgba(224,178,60,.16);
  --glow-2:    rgba(91,143,214,.12);
  --warn:      #cf6058;
  --warn-rgb:  207,96,88;
  --star:      "★";
}

/* ── CHICAGO: lakefront blue + flag red ── */
:root[data-city="chi"] {
  --bg:        #050f18;
  --surface:   #0c1a26;
  --surface-2: #122534;
  --border:    rgba(65,182,230,.14);
  --border-2:  rgba(65,182,230,.32);
  --text:      #eaf4fa;
  --muted:     #8ba3b4;
  --accent:    #41b6e6;
  --accent-lt: #9fdff8;
  --accent-dk: #1d5f80;
  --accent-rgb: 65,182,230;
  --second:    #e4415c;
  --second-rgb: 228,65,92;
  --glow-1:    rgba(65,182,230,.14);
  --glow-2:    rgba(228,65,92,.14);
  --warn:      #e4415c;
  --warn-rgb:  228,65,92;
  --star:      "✶";
}

* { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior:smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family:'DM Sans',system-ui,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  padding-bottom: env(safe-area-inset-bottom);
  transition: background-color .5s var(--ease), color .5s var(--ease);
}

/* film grain */
body::after {
  content:'';position:fixed;inset:0;z-index:900;pointer-events:none;opacity:.45;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
}

:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }

.mono { font-family:'Space Mono',monospace; }
.serif { font-family:'Playfair Display',serif; }

/* ═══════════════════════════════════════════════════════════
   HERO
   ═══════════════════════════════════════════════════════════ */
.hero { position:relative; padding:var(--s10) var(--s5) 0; overflow:hidden; text-align:center; }
.hero-fx { position:absolute; inset:0; pointer-events:none; }
.hero-fx::before {
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 75% 55% at 50% -8%, var(--glow-1) 0%, transparent 62%),
    radial-gradient(ellipse 45% 40% at 88% 82%, var(--glow-2) 0%, transparent 60%);
  transition:background .5s var(--ease);
}
.hero-fx::after {
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.012) 3px,rgba(255,255,255,.012) 4px);
}
.hero-inner { position:relative; z-index:2; }

/* city switch */
.city-switch {
  display:inline-flex; gap:var(--s1); padding:var(--s1);
  border:1px solid var(--border); border-radius:var(--r-pill);
  background:rgba(0,0,0,.35); backdrop-filter:blur(10px);
  margin-bottom:var(--s6);
}
.city-btn {
  font-family:'Space Mono',monospace; font-size:var(--t-sm); letter-spacing:2.5px;
  text-transform:uppercase; padding:10px 20px; min-height:40px;
  border:0; border-radius:var(--r-pill); background:transparent;
  color:var(--muted); cursor:pointer; transition:all .3s var(--ease);
}
.city-btn[aria-pressed="true"] { background:var(--accent); color:var(--bg); font-weight:700; }
.city-btn:not([aria-pressed="true"]):hover { color:var(--text); }

.hero-eyebrow {
  font-family:'Space Mono',monospace; font-size:var(--t-xs);
  letter-spacing:5px; text-transform:uppercase; color:var(--accent);
  margin-bottom:var(--s3);
}
.hero-title {
  font-family:'Playfair Display',serif; font-weight:900;
  font-size:clamp(46px,13vw,132px); line-height:.86; letter-spacing:-.02em;
  background:linear-gradient(155deg,var(--accent-lt) 0%,var(--accent) 42%,var(--second) 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.hero-sub {
  font-family:'Playfair Display',serif; font-style:italic;
  font-size:clamp(14px,3.4vw,20px); color:var(--accent-lt); margin-top:var(--s3);
  opacity:.85;
}
.hero-names {
  font-family:'Space Mono',monospace; font-size:var(--t-xs);
  letter-spacing:4px; color:var(--muted); margin-top:var(--s3);
}
.hero-names b { color:var(--second); font-weight:400; }

.fade-swap { animation:fadeUp .55s var(--ease); }
@keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }

/* stats */
.stats {
  display:flex; justify-content:center; flex-wrap:wrap;
  gap:var(--s2); margin-top:var(--s6);
}
.stat {
  flex:1 1 68px; max-width:120px;
  border:1px solid var(--border); border-radius:var(--r-md);
  background:rgba(255,255,255,.02); padding:var(--s3) var(--s2);
}
.stat-num {
  font-family:'Playfair Display',serif; font-weight:700;
  font-size:var(--t-xl); color:var(--accent-lt); line-height:1;
}
.stat-label {
  font-family:'Space Mono',monospace; font-size:7.5px; letter-spacing:1.4px;
  color:var(--muted); text-transform:uppercase; margin-top:6px; line-height:1.4;
}

/* skyline */
.skyline { position:relative; z-index:1; margin-top:var(--s6); line-height:0; }
.skyline svg { display:block; width:100%; height:auto; }
.skyline svg { fill:var(--accent); opacity:.16; }
.skyline .sky-nyc, .skyline .sky-chi { display:none; }
:root[data-city="nyc"] .skyline .sky-nyc { display:block; }
:root[data-city="chi"] .skyline .sky-chi { display:block; }

/* ═══════════════════════════════════════════════════════════
   STICKY CONTROLS
   ═══════════════════════════════════════════════════════════ */
.sticky-top {
  position:sticky; top:0; z-index:100;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  padding:var(--s3) var(--s4) var(--s2);
}
.controls-row { display:flex; gap:var(--s2); margin-bottom:var(--s2); max-width:1100px; margin-inline:auto; }
.search-input {
  flex:1; background:var(--surface); border:1px solid var(--border);
  padding:11px var(--s4); color:var(--text);
  font-family:'DM Sans',sans-serif; font-size:16px;
  border-radius:var(--r-md); outline:none; -webkit-appearance:none;
  transition:border-color .2s;
}
.search-input::placeholder { color:var(--muted); }
.search-input:focus { border-color:var(--border-2); }
.sort-btn {
  flex-shrink:0; min-height:44px; padding:0 var(--s4);
  font-family:'Space Mono',monospace; font-size:var(--t-xs); letter-spacing:1px;
  background:var(--surface); border:1px solid var(--border); color:var(--muted);
  border-radius:var(--r-md); cursor:pointer; text-transform:uppercase; transition:all .2s;
}
.sort-btn:hover { color:var(--text); border-color:var(--border-2); }

.filters {
  display:flex; gap:var(--s2); overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; padding-bottom:2px; max-width:1100px; margin-inline:auto;
}
.filters::-webkit-scrollbar { display:none; }
.filter-btn {
  flex-shrink:0; font-family:'Space Mono',monospace; font-size:var(--t-xs);
  letter-spacing:1px; padding:9px var(--s4); min-height:38px;
  border:1px solid var(--border); background:transparent; color:var(--muted);
  cursor:pointer; border-radius:var(--r-pill); white-space:nowrap;
  text-transform:uppercase; transition:all .2s;
}
.filter-btn:hover { color:var(--text); }
.filter-btn[aria-pressed="true"] {
  border-color:var(--accent); color:var(--accent);
  background:rgba(var(--accent-rgb),.12);
}

/* ═══════════════════════════════════════════════════════════
   GO-BACK RAIL
   ═══════════════════════════════════════════════════════════ */
.rail-wrap { padding:var(--s8) 0 0; max-width:1100px; margin-inline:auto; }
.rail-head { padding:0 var(--s5); display:flex; align-items:baseline; gap:var(--s3); flex-wrap:wrap; }
.rail-title {
  font-family:'Playfair Display',serif; font-size:var(--t-2xl);
  font-weight:700; color:var(--text);
}
.rail-note { font-family:'Space Mono',monospace; font-size:var(--t-xs); color:var(--muted); letter-spacing:1.5px; }
.rail {
  display:flex; gap:var(--s2); overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; padding:var(--s4) var(--s5) var(--s2);
  scroll-snap-type:x mandatory;
}
.rail::-webkit-scrollbar { display:none; }
.rail-card {
  flex:0 0 152px; scroll-snap-align:start;
  background:linear-gradient(160deg,var(--surface-2),var(--surface));
  border:1px solid var(--border); border-radius:var(--r-md);
  padding:var(--s3) var(--s3) var(--s3) var(--s4);
  position:relative; overflow:hidden;
  display:flex; flex-direction:column; justify-content:space-between; gap:var(--s3);
  min-height:104px;
}
.rail-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--card-color,var(--accent)); }
.rail-rank {
  font-family:'Space Mono',monospace; font-size:var(--t-xs);
  color:var(--muted); letter-spacing:1px;
}
.rail-name { font-size:var(--t-md); font-weight:500; line-height:1.28; }
.rail-foot { display:flex; align-items:center; justify-content:space-between; gap:var(--s2); }
.rail-score {
  font-family:'Space Mono',monospace; font-weight:700; font-size:var(--t-md);
  color:var(--card-color,var(--accent));
}
.rail-cat { font-size:12px; opacity:.75; }

/* ═══════════════════════════════════════════════════════════
   SECTIONS + CARDS
   ═══════════════════════════════════════════════════════════ */
.sections { padding:var(--s8) var(--s5) var(--s16); display:grid; gap:var(--s10); max-width:1100px; margin-inline:auto; }
.section-header {
  display:flex; align-items:baseline; gap:var(--s3);
  margin-bottom:var(--s4); padding-bottom:var(--s3);
  border-bottom:1px solid var(--border); position:relative;
}
.section-header::after { content:''; position:absolute; bottom:-1px; left:0; width:52px; height:2px; background:var(--accent); }
.section-emoji { font-size:var(--t-lg); }
.section-title { font-family:'Playfair Display',serif; font-size:var(--t-2xl); font-weight:700; }
.section-count { font-family:'Space Mono',monospace; font-size:var(--t-xs); color:var(--muted); letter-spacing:2px; margin-left:auto; }

.card-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:var(--s2); }
@media (min-width:620px) { .card-grid { grid-template-columns:repeat(3,1fr); gap:var(--s3); } }
@media (min-width:900px) { .card-grid { grid-template-columns:repeat(4,1fr); } }

.card {
  background:var(--surface); border:1px solid var(--border);
  padding:var(--s3) var(--s3) var(--s3) var(--s4);
  border-radius:var(--r-sm); position:relative; overflow:hidden;
  display:flex; flex-direction:column; gap:var(--s2);
  transition:background .2s, border-color .2s, transform .2s var(--ease);
}
.card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2.5px; background:var(--card-color,var(--rt-none)); }
.card:hover { background:var(--surface-2); border-color:var(--border-2); transform:translateY(-2px); }
.card.go-back { box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.10); }

.card-name { font-size:var(--t-md); font-weight:500; line-height:1.3; }
.card-meta { display:flex; align-items:center; gap:var(--s2); margin-top:auto; }
.card-score {
  font-family:'Space Mono',monospace; font-size:11px; font-weight:700;
  color:var(--card-color,var(--muted)); white-space:nowrap;
}
.card-bar { flex:1; height:2px; background:rgba(255,255,255,.07); border-radius:1px; overflow:hidden; max-width:56px; }
.card-fill { height:100%; background:var(--card-color,var(--muted)); border-radius:1px; }
.card-note {
  font-size:var(--t-xs); color:var(--muted);
  font-family:'Space Mono',monospace; letter-spacing:.3px; line-height:1.4;
}
.badges { display:flex; flex-wrap:wrap; gap:4px; }
.badge {
  font-family:'Space Mono',monospace; font-size:7.5px; letter-spacing:.6px;
  padding:2px 6px; border-radius:2px; text-transform:uppercase; white-space:nowrap;
}
.b-fave    { background:rgba(var(--second-rgb),.14); border:1px solid rgba(var(--second-rgb),.32); color:var(--second); }
.b-goback  { background:rgba(var(--accent-rgb),.12); border:1px solid rgba(var(--accent-rgb),.30); color:var(--accent); }
.b-repeat  { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); color:var(--muted); }
.b-new     { background:rgba(var(--accent-rgb),.16); border:1px solid rgba(var(--accent-rgb),.35); color:var(--accent-lt); }

/* rating tiers */
.r-elite { --card-color:var(--rt-elite); }
.r9  { --card-color:var(--rt-9); }
.r8  { --card-color:var(--rt-8); }
.r7  { --card-color:var(--rt-7); }
.r6  { --card-color:var(--rt-6); }
.r5  { --card-color:var(--rt-5); }
.r-low  { --card-color:var(--rt-low); }
.r-none { --card-color:var(--rt-none); }

/* ── to-do list ── */
.todo-grid { display:grid; grid-template-columns:1fr; gap:6px; }
@media (min-width:760px) { .todo-grid { grid-template-columns:1fr 1fr; gap:var(--s2); } }
.todo-card {
  display:flex; align-items:center; gap:var(--s3);
  background:var(--surface); border:1px solid var(--border);
  border-left:2.5px solid var(--rt-none);
  padding:var(--s3) var(--s4); border-radius:var(--r-sm);
  transition:background .2s, border-color .2s;
}
.todo-card:hover { background:var(--surface-2); }
.todo-card.up-next { border-left-color:var(--accent); }
.todo-num { font-family:'Space Mono',monospace; font-size:var(--t-sm); color:var(--muted); min-width:22px; }
.todo-text { font-size:var(--t-md); font-weight:500; }
.todo-tag {
  font-family:'Space Mono',monospace; font-size:7.5px; letter-spacing:.6px;
  padding:3px 8px; border-radius:var(--r-pill); white-space:nowrap; margin-left:auto;
}
.tag-next { background:rgba(var(--accent-rgb),.15); color:var(--accent); border:1px solid rgba(var(--accent-rgb),.3); }
.tag-any  { background:rgba(var(--second-rgb),.12); color:var(--second); border:1px solid rgba(var(--second-rgb),.25); }
.tag-city { background:rgba(255,255,255,.04); color:var(--muted); border:1px solid rgba(255,255,255,.1); }

/* ── the crimes ── */
.crimes { max-width:1100px; margin:0 auto; padding:0 var(--s5) var(--s12); }
.crimes-box {
  border:1px dashed rgba(var(--warn-rgb),.28); border-radius:var(--r-md);
  background:rgba(var(--warn-rgb),.04); padding:var(--s5);
}
.crimes-title {
  font-family:'Space Mono',monospace; font-size:var(--t-xs); letter-spacing:3px;
  color:var(--warn); text-transform:uppercase; margin-bottom:var(--s3);
}
.crimes-list { display:flex; flex-wrap:wrap; gap:var(--s2); }
.crime {
  font-size:11.5px; padding:5px 10px; border-radius:var(--r-pill);
  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07);
  color:var(--muted);
}
.crime b { color:var(--text); font-weight:500; }

/* ── legend ── */
.legend { max-width:1100px; margin:0 auto; padding:0 var(--s5) var(--s10); display:flex; flex-wrap:wrap; gap:var(--s4); }
.legend-item { display:flex; align-items:center; gap:6px; font-family:'Space Mono',monospace; font-size:var(--t-xs); color:var(--muted); letter-spacing:.5px; }
.legend-dot { width:9px; height:9px; border-radius:2px; }

/* ── footer ── */
.footer { text-align:center; padding:var(--s8) var(--s5) calc(var(--s8) + env(safe-area-inset-bottom)); border-top:1px solid var(--border); }
.footer-main { font-family:'Playfair Display',serif; font-style:italic; font-size:var(--t-lg); color:var(--accent-lt); }
.footer-sub { font-family:'Space Mono',monospace; font-size:var(--t-xs); color:var(--muted); letter-spacing:2px; margin-top:6px; }
.footer-mark { font-size:var(--t-lg); margin-top:var(--s2); color:var(--second); }
.footer-mark::before { content:var(--star); }

.hidden { display:none !important; }
.empty-msg { font-family:'Space Mono',monospace; font-size:var(--t-sm); color:var(--muted); letter-spacing:1px; padding:var(--s10) 0; text-align:center; }

@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

/* ═══════════════════════════════════════════════════════════
   PASSWORD GATE
   ═══════════════════════════════════════════════════════════ */
#pw-gate {
  position:fixed; inset:0; z-index:9999;
  background:rgba(3,5,10,.94); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:center; transition:opacity .4s;
}
#pw-card {
  background:var(--surface); border:1px solid var(--border-2);
  border-radius:var(--r-lg); padding:var(--s10) var(--s8);
  max-width:340px; width:88%; text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.6);
}
#pw-card h2 { font-family:'Playfair Display',serif; font-size:var(--t-2xl); margin-bottom:var(--s2); color:var(--text); }
#pw-card p { font-family:'Space Mono',monospace; font-size:var(--t-xs); letter-spacing:2px; color:var(--muted); margin-bottom:var(--s6); text-transform:uppercase; }
#pw-input {
  width:100%; padding:12px var(--s4); background:var(--bg);
  border:1px solid var(--border); border-radius:var(--r-md);
  font-size:16px; text-align:center; letter-spacing:.2em; color:var(--text);
  outline:none; transition:border-color .2s;
}
#pw-input:focus { border-color:var(--accent); }
#pw-btn {
  margin-top:var(--s3); width:100%; padding:12px; min-height:46px;
  background:var(--accent); color:var(--bg); border:none; border-radius:var(--r-md);
  font-family:'Space Mono',monospace; font-size:var(--t-sm); font-weight:700;
  letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:opacity .2s;
}
#pw-btn:hover { opacity:.85; }
#pw-error { margin-top:var(--s3); font-family:'Space Mono',monospace; font-size:var(--t-xs); color:var(--second); min-height:1.2em; }

const CATS = [
  { key:"food",    emoji:"🍽", title:"Food" },
  { key:"drinks",  emoji:"🍷", title:"Drinks" },
  { key:"dessert", emoji:"🍰", title:"Dessert" },
  { key:"vibes",   emoji:"✨", title:"Vibes" },
];

const GO_BACK = 8;   // "anything higher than an 8 is worth going back"

/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
let city   = 'nyc';
let filter = 'all';
let sortBy = 'rating';   // 'rating' | 'name'

/* ═══════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════ */
const has = r => Number.isFinite(r);

function tierClass(r) {
  if (!has(r))  return 'r-none';
  if (r >= 10)  return 'r-elite';
  if (r >= 9)   return 'r9';
  if (r >= 8)   return 'r8';
  if (r >= 7)   return 'r7';
  if (r >= 6)   return 'r6';
  if (r >= 5)   return 'r5';
  return 'r-low';
}

function scoreText(r) {
  if (!has(r)) return '—';
  if (r > 10)  return r + '/10 🔥';
  return r + '/10';
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function allPlaces(c) {
  return CATS.flatMap(cat => (DATA[c][cat.key] || []).map(p => ({...p, cat:cat.key, emoji:cat.emoji})));
}

function matchesSearch(name, note) {
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  if (!q) return true;
  return (name + ' ' + (note || '')).toLowerCase().includes(q);
}

function sortPlaces(list) {
  const arr = [...list];
  if (sortBy === 'name') return arr.sort((a,b) => a.name.localeCompare(b.name));
  return arr.sort((a,b) => {
    const ra = has(a.rating) ? a.rating : -1;
    const rb = has(b.rating) ? b.rating : -1;
    return rb - ra || a.name.localeCompare(b.name);
  });
}

/* ═══════════════════════════════════════════════════════════
   TEMPLATES
   ═══════════════════════════════════════════════════════════ */
function cardHTML(p) {
  const tier    = tierClass(p.rating);
  const goBack  = has(p.rating) && p.rating >= GO_BACK;
  const pct     = has(p.rating) ? Math.min(100, Math.round((p.rating / 10) * 100)) : 0;
  const badges  = [
    p.special ? '<span class="badge b-fave">✦ fave</span>' : '',
    goBack    ? '<span class="badge b-goback">↩ go back</span>' : '',
    p.visits > 1 ? `<span class="badge b-repeat">${p.visits}×</span>` : '',
  ].join('');

  return `<article class="card ${tier} ${goBack ? 'go-back' : ''}">
    <div class="card-name">${esc(p.name)}</div>
    ${p.note ? `<div class="card-note">${esc(p.note)}</div>` : ''}
    <div class="card-meta">
      <span class="card-score">${scoreText(p.rating)}</span>
      ${has(p.rating) ? `<span class="card-bar"><span class="card-fill" style="width:${pct}%"></span></span>` : ''}
    </div>
    ${badges ? `<div class="badges">${badges}</div>` : ''}
  </article>`;
}

function todoHTML(t, i) {
  const tag = t.next ? ['tag-next','up next'] : t.any ? ['tag-any','any city'] : ['tag-city', city === 'nyc' ? 'nyc' : 'chi'];
  return `<div class="todo-card ${t.next ? 'up-next' : ''}">
    <span class="todo-num">${String(i+1).padStart(2,'0')}</span>
    <div style="flex:1">
      <div class="todo-text">${esc(t.name)}</div>
      ${t.note ? `<div class="card-note">${esc(t.note)}</div>` : ''}
    </div>
    <span class="todo-tag ${tag[0]}">${tag[1]}</span>
  </div>`;
}

function railCardHTML(p, i) {
  return `<div class="rail-card ${tierClass(p.rating)}">
    <div>
      <div class="rail-rank">${String(i+1).padStart(2,'0')}</div>
      <div class="rail-name">${esc(p.name)}</div>
    </div>
    <div class="rail-foot">
      <span class="rail-score">${scoreText(p.rating)}</span>
      <span class="rail-cat">${p.emoji}</span>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════ */
function renderHero() {
  const d = DATA[city];
  const t = document.getElementById('heroTitle');
  const e = document.getElementById('heroEyebrow');
  const s = document.getElementById('heroSub');
  [t,e,s].forEach(el => el.classList.remove('fade-swap'));
  void t.offsetWidth;
  t.textContent = d.label; e.textContent = d.eyebrow; s.textContent = d.sub;
  [t,e,s].forEach(el => el.classList.add('fade-swap'));

  const rated  = allPlaces(city).filter(p => has(p.rating));
  const avg    = rated.length ? (rated.reduce((a,p) => a + Math.min(p.rating,10), 0) / rated.length).toFixed(1) : '—';
  const goBack = rated.filter(p => p.rating >= GO_BACK).length;

  document.getElementById('stats').innerHTML = [
    [allPlaces(city).length, 'places'],
    [avg,                    'avg score'],
    [goBack,                 'go back'],
    [DATA[city].todo.length, 'to do'],
  ].map(([n,l]) => `<div class="stat"><div class="stat-num">${n}</div><div class="stat-label">${l}</div></div>`).join('');
}

function renderRail() {
  const top = sortPlaces(allPlaces(city).filter(p => has(p.rating) && p.rating >= GO_BACK));
  document.getElementById('rail').innerHTML = top.map(railCardHTML).join('');
  document.getElementById('railNote').textContent = `${top.length} SPOTS · ${GO_BACK}+ ONLY`;
  document.getElementById('railWrap').classList.toggle('hidden', top.length === 0 || filter === 'todo');
}

function renderSections() {
  const showCat = k => filter === 'all' || filter === 'goback' || filter === 'elite' || filter === k;
  let html = '';

  CATS.forEach(cat => {
    if (!showCat(cat.key)) return;
    let items = (DATA[city][cat.key] || []).filter(p => matchesSearch(p.name, p.note));
    if (filter === 'goback') items = items.filter(p => has(p.rating) && p.rating >= GO_BACK);
    if (filter === 'elite')  items = items.filter(p => has(p.rating) && p.rating >= 9);
    if (!items.length) return;
    html += `<section class="section">
      <div class="section-header">
        <span class="section-emoji">${cat.emoji}</span>
        <h2 class="section-title">${cat.title}</h2>
        <span class="section-count">${items.length}</span>
      </div>
      <div class="card-grid">${sortPlaces(items).map(cardHTML).join('')}</div>
    </section>`;
  });

  if (filter === 'all' || filter === 'todo') {
    const todos = DATA[city].todo.filter(t => matchesSearch(t.name, t.note));
    if (todos.length) {
      html += `<section class="section">
        <div class="section-header">
          <span class="section-emoji">📍</span>
          <h2 class="section-title">Things To Do</h2>
          <span class="section-count">${todos.length}</span>
        </div>
        <div class="todo-grid">${todos.map(todoHTML).join('')}</div>
      </section>`;
    }
  }

  document.getElementById('sections').innerHTML = html || `<div class="empty-msg">NOTHING MATCHES — TRY ANOTHER SEARCH</div>`;
}

function renderCrimes() {
  const bad = sortPlaces(allPlaces(city).filter(p => has(p.rating) && p.rating <= 3)).reverse();
  const box = document.getElementById('crimes');
  if (!bad.length || filter !== 'all') { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="crimes-box">
    <div class="crimes-title">⚠ the crimes — never again</div>
    <div class="crimes-list">${bad.map(p => `<span class="crime"><b>${esc(p.name)}</b> · ${p.rating}</span>`).join('')}</div>
  </div>`;
}

function render() {
  renderRail();
  renderSections();
  renderCrimes();
}

/* ═══════════════════════════════════════════════════════════
   CONTROLS
   ═══════════════════════════════════════════════════════════ */
function setCity(c) {
  city = c;
  document.documentElement.dataset.city = c;
  document.getElementById('btn-nyc').setAttribute('aria-pressed', c === 'nyc');
  document.getElementById('btn-chi').setAttribute('aria-pressed', c === 'chi');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', c === 'nyc' ? '#07090f' : '#050f18');
  try { localStorage.setItem('dsn-city', c); } catch(e) {}
  renderHero();
  render();
}

function setFilter(btn) {
  filter = btn.dataset.f;
  document.querySelectorAll('.filter-btn').forEach(b => b.setAttribute('aria-pressed', b === btn));
  render();
}

function toggleSort() {
  sortBy = sortBy === 'rating' ? 'name' : 'rating';
  document.getElementById('sortBtn').textContent = sortBy === 'rating' ? '↓ Rating' : 'A–Z';
  render();
}

/* ═══════════════════════════════════════════════════════════
   PASSWORD GATE
   ═══════════════════════════════════════════════════════════ */
function checkPassword() {
  const inp = document.getElementById('pw-input');
  const err = document.getElementById('pw-error');
  if (inp.value.trim().toLowerCase() === 'dsn') {
    sessionStorage.setItem('dsn-unlocked', '1');
    unlock();
  } else {
    inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
    err.textContent = 'nope. try again.';
    inp.value = '';
  }
}

function unlock() {
  const gate = document.getElementById('pw-gate');
  if (!gate) return;
  gate.style.opacity = '0';
  setTimeout(() => gate.remove(), 400);
}

/* ═══════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════ */
(function init() {
  let saved = null;
  try { saved = localStorage.getItem('dsn-city'); } catch(e) {}
  setCity(saved === 'chi' ? 'chi' : 'nyc');

  if (sessionStorage.getItem('dsn-unlocked') === '1') {
    unlock();
  } else {
    setTimeout(() => document.getElementById('pw-input')?.focus(), 100);
  }
})();
</script>

</body>
</html>
